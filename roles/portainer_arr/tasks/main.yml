---
- name: "Arr | Restore any missing volumes from S3"
  ansible.builtin.include_role:
    name: chatton.docker_backup.docker_s3_volume_restore
  vars:
    docker_backup_s3_volume: "{{ item }}"
  with_items:
    - name: "{{ arr_portainer_stack_name }}_qbittorrent_config"
    - name: "{{ arr_portainer_stack_name }}_radarr_config"
    - name: "{{ arr_portainer_stack_name }}_sonarr_config"
    - name: "{{ arr_portainer_stack_name }}_lidarr_config"
    - name: "{{ arr_portainer_stack_name }}_jackett_config"
    - name: "{{ arr_portainer_stack_name }}_gluetun"
    - name: "{{ arr_portainer_stack_name }}_nzbget_config"

- name: "Arr | Ensure arr-scripts directory exists."
  ansible.builtin.file:
    path: "{{ directories.docker_compose_directory }}/arr-scripts"
    state: directory
    mode: "0755"

- name: "Arr | Deploy Radarr/Sonarr import script (works around the mergerfs copy_file_range bug - see CLAUDE.md)."
  ansible.builtin.copy:
    src: import.sh
    dest: "{{ directories.docker_compose_directory }}/arr-scripts/import.sh"
    mode: "0755"

- name: "Arr | Update Portainer."
  chatton.portainer.portainer_stack:
    username: '{{ portainer_user }}'
    password: '{{ portainer.password }}'
    base_url: '{{ portainer_base_url }}'
    stack_name: '{{ arr_portainer_stack_name }}'
    endpoint_id: '{{ portainer_endpoint }}'
    state: present
    definition:
      version: "3.1"
      services:
        protonwire:
          container_name: protonwire
          image: "qmcgaw/gluetun"
          restart: unless-stopped
          environment:
            VPN_SERVICE_PROVIDER: protonvpn
            VPN_TYPE: wireguard
            SERVER_COUNTRIES: Netherlands
            WIREGUARD_PRIVATE_KEY: "{{ vpn.wireguard_private_key }}"
            FIREWALL_OUTBOUND_SUBNETS: "{{ vpn.lan_network }}"
          cap_add:
            - NET_ADMIN
          volumes:
            - gluetun:/gluetun
          ports:
            # qbittorrent
            - "{{ qbittorrent_exposed_web_ui_port }}:15000"
            - "{{ qbittorrent_exposed_download_port }}:6881"
            - "{{ qbittorrent_exposed_download_port }}:6881/udp"
            # radarr
            - "{{ radarr_exposed_port }}:7878"
            # sonarr
            - "{{ sonarr_exposed_port }}:8989"
            # lidarr
            - "{{ lidarr_exposed_port }}:8686"
            # jackett
            - "{{ jackett_exposed_port }}:9117"
            - "8191:8191"
        nzbget:
          labels: "{{ backup_labels}}"
          container_name: nzbget
          image: ghcr.io/nzbgetcom/nzbget:latest
          environment:
            - PUID=1000
            - PGID=1000
            - TZ=Europe/London
            - "NZBGET_USER={{ nzbget_username }}"
            - "NZBGET_PASS={{ nzbget_password }}"
          volumes:
            - nzbget_config:/config
            - "{{ directories.downloads_dir }}:/downloads"
          ports:
            - 6789:6789
          restart: unless-stopped

        qbittorrent:
            labels: "{{ backup_labels}}"
            depends_on:
              - protonwire
            image: "{{ qbittorrent_image }}:{{ qbittorrent_tag }}"
            container_name: "{{ qbittorrent_container_name }}"
            network_mode: "service:protonwire"
            environment:
              - "PUID={{ qbittorrent_puid }}"
              - "PGID={{ qbittorrent_pgid }}"
              - TZ=Europe/London
              - "WEBUI_PORT=15000"
            volumes:
              - qbittorrent_config:/config
              - "{{ directories.downloads_dir }}:/downloads"
            restart: unless-stopped

        radarr:
          labels: "{{ backup_labels}}"
          depends_on:
            - protonwire
          image: "{{ radarr_image }}:{{ radarr_tag }}"
          container_name: "{{ radarr_container_name }}"
          network_mode: "service:protonwire"
          environment:
            - "PUID={{ radarr_puid }}"
            - "PGID={{ radarr_pgid }}"
            - TZ=Europe/London
          volumes:
            - radarr_config:/config
            - "{{ directories.movies_dir }}:/movies"
            - "{{ directories.downloads_dir }}:/downloads"
            - "{{ directories.docker_compose_directory }}/arr-scripts:/scripts:ro"
          restart: unless-stopped

        sonarr:
          depends_on:
            - protonwire
          image: "{{ sonarr_image }}:{{ sonarr_tag }}"
          labels: "{{ backup_labels}}"
          container_name: "{{ sonarr_container_name }}"
          network_mode: "service:protonwire"
          environment:
            - "PUID={{ sonarr_puid }}"
            - "PGID={{ sonarr_pgid }}"
            - TZ=Europe/London
          volumes:
            - sonarr_config:/config
            - "{{ directories.tv_dir }}:/tv"
            - "{{ directories.downloads_dir }}:/downloads"
            - "{{ directories.docker_compose_directory }}/arr-scripts:/scripts:ro"
          restart: unless-stopped

        lidarr:
          depends_on:
            - protonwire
          image: "{{ lidarr_image }}:{{ lidarr_tag }}"
          labels: "{{ backup_labels}}"
          container_name: "{{ lidarr_container_name }}"
          network_mode: "service:protonwire"
          environment:
            - "PUID={{ lidarr_puid }}"
            - "PGID={{ lidarr_pgid }}"
            - TZ=Europe/London
          volumes:
            - lidarr_config:/config
            - "{{ directories.music_dir }}:/music"
            - "{{ directories.downloads_dir }}:/downloads"
          restart: unless-stopped

        jackett:
          labels: "{{ backup_labels}}"
          depends_on:
            - protonwire
          image: "{{ jackett_image }}:{{ jackett_tag }}"
          container_name: "{{ jackett_container_name }}"
          network_mode: "service:protonwire"
          environment:
            - "PUID={{ jackett_puid }}"
            - "PGID={{ jackett_pgid }}"
            - TZ=Europe/London
            - AUTO_UPDATE=true
          volumes:
            - jackett_config:/config
            - "{{ directories.downloads_dir }}:/downloads"
          restart: unless-stopped

        flaresolverr:
          network_mode: "service:protonwire"
          depends_on:
            - protonwire
          image: ghcr.io/flaresolverr/flaresolverr:latest
          container_name: flaresolverr
          environment:
            - "LOG_LEVEL=info"
            - "LOG_HTML=false"
            - "CAPTCHA_SOLVER=none"
            - "TZ=Europe/London"
          restart: unless-stopped
      volumes:
         qbittorrent_config: {}
         radarr_config: {}
         sonarr_config: {}
         lidarr_config: {}
         jackett_config: {}
         gluetun: {}
         nzbget_config: {}

- name: "Arr | Get Radarr media management config."
  ansible.builtin.uri:
    url: "http://localhost:{{ radarr_exposed_port }}/api/v3/config/mediamanagement/1"
    headers:
      X-Api-Key: "{{ radarr_api_key }}"
    return_content: true
  register: radarr_mediamanagement_current
  retries: 5
  delay: 5
  until: radarr_mediamanagement_current.status == 200

- name: "Arr | Enable useScriptImport on Radarr (works around the mergerfs copy_file_range IOException - see CLAUDE.md)."
  ansible.builtin.uri:
    url: "http://localhost:{{ radarr_exposed_port }}/api/v3/config/mediamanagement/1"
    method: PUT
    headers:
      X-Api-Key: "{{ radarr_api_key }}"
    body_format: json
    body: "{{ radarr_mediamanagement_current.json | combine({'useScriptImport': true, 'scriptImportPath': '/scripts/import.sh'}) }}"
    status_code: 200
  when: >-
    not radarr_mediamanagement_current.json.useScriptImport or
    radarr_mediamanagement_current.json.scriptImportPath != '/scripts/import.sh'

- name: "Arr | Get Sonarr media management config."
  ansible.builtin.uri:
    url: "http://localhost:{{ sonarr_exposed_port }}/api/v3/config/mediamanagement/1"
    headers:
      X-Api-Key: "{{ sonarr_api_key }}"
    return_content: true
  register: sonarr_mediamanagement_current
  retries: 5
  delay: 5
  until: sonarr_mediamanagement_current.status == 200

- name: "Arr | Enable useScriptImport on Sonarr (works around the mergerfs copy_file_range IOException - see CLAUDE.md)."
  ansible.builtin.uri:
    url: "http://localhost:{{ sonarr_exposed_port }}/api/v3/config/mediamanagement/1"
    method: PUT
    headers:
      X-Api-Key: "{{ sonarr_api_key }}"
    body_format: json
    body: "{{ sonarr_mediamanagement_current.json | combine({'useScriptImport': true, 'scriptImportPath': '/scripts/import.sh'}) }}"
    status_code: 200
  when: >-
    not sonarr_mediamanagement_current.json.useScriptImport or
    sonarr_mediamanagement_current.json.scriptImportPath != '/scripts/import.sh'
