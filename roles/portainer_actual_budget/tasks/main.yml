---
- name: "Actual Budget | Restore any missing volumes from S3"
  ansible.builtin.include_role:
    name: chatton.docker_backup.docker_s3_volume_restore
  vars:
    docker_backup_s3_volume:
      name: "{{ actual_budget_portainer_stack_name }}_data"

- name: "Actual Budget | Update Portainer."
  chatton.portainer.portainer_stack:
    username: '{{ portainer_user }}'
    password: '{{ portainer.password }}'
    base_url: '{{ portainer_base_url }}'
    stack_name: '{{ actual_budget_portainer_stack_name }}'
    endpoint_id: '{{ portainer_endpoint }}'
    state: "{{ actual_budget_state }}"
    definition:
      version: '3'
      services:
        actual-budget:
          labels: "{{ backup_labels }}"
          container_name: "{{ actual_budget_container_name }}"
          image: "{{ actual_budget_image }}:{{ actual_budget_tag }}"
          ports:
            - "{{ actual_budget_expose_port }}:5006"
          volumes:
            - data:/data
          restart: "{{ restart_policy }}"
      volumes:
        data: {}
