---
- name: Homelab Maintenance Agent | Ensure base directory exists.
  ansible.builtin.file:
    path: "{{ homelab_maintenance_agent_base_dir }}"
    state: directory
    mode: '0700'

- name: Homelab Maintenance Agent | Ensure log directory exists.
  ansible.builtin.file:
    path: "{{ homelab_maintenance_agent_log_dir }}"
    state: directory
    mode: '0700'

- name: Homelab Maintenance Agent | Clone or update repo checkout.
  ansible.builtin.git:
    repo: "{{ homelab_maintenance_agent_repo_url }}"
    dest: "{{ homelab_maintenance_agent_repo_path }}"
    version: "{{ homelab_maintenance_agent_base_branch }}"
    force: true

- name: Homelab Maintenance Agent | Write GitHub token.
  ansible.builtin.copy:
    content: "{{ homelab_maintenance_agent_gh_token }}"
    dest: "{{ homelab_maintenance_agent_gh_token_path }}"
    mode: '0600'
  no_log: true

- name: Homelab Maintenance Agent | Write Claude Code OAuth token.
  ansible.builtin.copy:
    content: "{{ homelab_maintenance_agent_claude_oauth_token }}"
    dest: "{{ homelab_maintenance_agent_claude_token_path }}"
    mode: '0600'
  no_log: true

- name: Homelab Maintenance Agent | Configure gh as the git credential helper.
  ansible.builtin.shell: |
    export GH_TOKEN="$(cat {{ homelab_maintenance_agent_gh_token_path }})"
    gh auth setup-git
  args:
    executable: /bin/bash
  changed_when: false

- name: Homelab Maintenance Agent | Template CLAUDE.md (agent-local, never committed).
  ansible.builtin.template:
    src: CLAUDE.md.j2
    dest: "{{ homelab_maintenance_agent_claude_md_path }}"
    mode: '0644'

- name: Homelab Maintenance Agent | Exclude agent-local files from git.
  ansible.builtin.lineinfile:
    path: "{{ homelab_maintenance_agent_repo_path }}/.git/info/exclude"
    line: "{{ item }}"
    create: true
    mode: '0644'
  loop:
    - "/CLAUDE.md"
    - "/.maintenance-agent-checklist.md"

- name: Homelab Maintenance Agent | Template run script.
  ansible.builtin.template:
    src: run-agent.sh.j2
    dest: "{{ homelab_maintenance_agent_script_path }}"
    mode: '0700'
  no_log: true

- name: Homelab Maintenance Agent | Remove old nightly-named cron entry.
  become: true
  ansible.builtin.cron:
    name: "homelab maintenance agent (nightly)"
    cron_file: homelab_maintenance_agent
    state: absent

- name: Homelab Maintenance Agent | Remove legacy nightly entry from user crontab.
  ansible.builtin.cron:
    name: "homelab maintenance agent (nightly)"
    state: absent

- name: Homelab Maintenance Agent | Ensure weekly cron entry.
  become: true
  ansible.builtin.cron:
    name: "homelab maintenance agent (weekly)"
    minute: "{{ homelab_maintenance_agent_cron_minute }}"
    hour: "{{ homelab_maintenance_agent_cron_hour }}"
    weekday: "{{ homelab_maintenance_agent_cron_weekday }}"
    job: "{{ homelab_maintenance_agent_script_path }} >> {{ homelab_maintenance_agent_log_dir }}/cron.log 2>&1"
    user: "{{ homelab_user }}"
    cron_file: homelab_maintenance_agent
    state: "{{ homelab_maintenance_agent_cron_state }}"
