# group qnap and linode to run operations on.
# this ensures we don't run everything on localhost as well.
[servers:children]
qnaps
linodes
dells

[qnaps]
qnap

[dells]
dell

[portainer]
qnap

[portainer_agent]
dell

[docker]
qnap
dell

[mergerfs]
qnap

[samba]
qnap

# Proxmox hypervisor host. Runs proxmox_bootstrap (admin user, sudo, SSH
# key, power management) via its own play in playbooks/setup-homelab.yml
# (hosts: proxmox), and playbooks/bootstrap-proxmox.yml for the initial
# root-connection run. Intentionally not in [servers], so it's not
# targeted by the docker/portainer/mergerfs/monitoring group plays there.
[proxmox]
pve

